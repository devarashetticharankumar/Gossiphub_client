
[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"


[[redirects]]
  from = "/sitemap.xml"
  to = "https://backendserver.gossiphub.in/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
